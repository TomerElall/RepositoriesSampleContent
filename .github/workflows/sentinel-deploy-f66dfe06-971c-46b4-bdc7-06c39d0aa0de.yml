name: Deploy Content to sentinel-jamescoliz-DSPM-13 [f66dfe06-971c-46b4-bdc7-06c39d0aa0de]
# Note: This workflow will deploy everything in the root directory.
# To deploy content only from a specific path (for example SentinelContent):
#   1. Add the target path to the "paths" property like such
#    paths:
#    - 'SentinelContent/**'
#    - '!.github/workflows/**'
#    - '.github/workflows/sentinel-deploy-f66dfe06-971c-46b4-bdc7-06c39d0aa0de.yml'
#   2. Append the path to the directory environment variable below
#       directory: '${{ github.workspace }}/SentinelContent'

on:
  push:
    branches: [ main-sentinel-deployment ]
    paths:
    - '**'
    - '!.github/workflows/**'  # this filter prevents other workflow changes from triggering this workflow
    - '.github/workflows/sentinel-deploy-f66dfe06-971c-46b4-bdc7-06c39d0aa0de.yml'

jobs:
  deploy-content:
    runs-on: windows-latest
    env:
      resourceGroupName: 'sentinel-rg-jamescoliz-DSPM-13'
      workspaceName: 'sentinel-jamescoliz-DSPM-13'
      workspaceId: '6810bee3-31f7-4ded-9042-b7a6cefcf59f'
      directory: '${{ github.workspace }}'
      cloudEnv: 'AzureCloud'
      contentTypes: 'AnalyticsRule'
      branch: 'main-sentinel-deployment'
      sourceControlId: 'f66dfe06-971c-46b4-bdc7-06c39d0aa0de'
      rootDirectory: '${{ github.workspace }}'
      githubAuthToken: ${{ secrets.GITHUB_TOKEN }}
      smartDeployment: 'true'
    permissions:
      contents: write
      id-token: write # Require write permission to Fetch an OIDC token.

    steps:
    - name: Login to Azure (Attempt 1)
      continue-on-error: true
      id: login1
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_f66dfe06971c46b4bdc706c39d0aa0de }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_f66dfe06971c46b4bdc706c39d0aa0de }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_f66dfe06971c46b4bdc706c39d0aa0de }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 1 failed
      if: ${{ steps.login1.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 2)
      continue-on-error: true
      id: login2
      uses: azure/login@v2
      if: ${{ steps.login1.outcome=='failure' }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_f66dfe06971c46b4bdc706c39d0aa0de }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_f66dfe06971c46b4bdc706c39d0aa0de }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_f66dfe06971c46b4bdc706c39d0aa0de }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 2 failed
      if: ${{ steps.login2.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 3)
      continue-on-error: false
      id: login3
      uses: azure/login@v2
      if: ${{ steps.login2.outcome=='failure'  }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_f66dfe06971c46b4bdc706c39d0aa0de }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_f66dfe06971c46b4bdc706c39d0aa0de }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_f66dfe06971c46b4bdc706c39d0aa0de }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Checkout
      uses: actions/checkout@v3

    - name: Deploy Content to Microsoft Sentinel
      uses: azure/powershell@v2
      with:
        azPSVersion: 'latest'
        inlineScript: |
          ${{ github.workspace }}//.github/workflows/azure-sentinel-deploy-f66dfe06-971c-46b4-bdc7-06c39d0aa0de.ps1