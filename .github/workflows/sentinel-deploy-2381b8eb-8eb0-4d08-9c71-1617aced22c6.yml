name: Deploy Content to sentinel-jamescoliz-DSPM-04 [2381b8eb-8eb0-4d08-9c71-1617aced22c6]
# Note: This workflow will deploy everything in the root directory.
# To deploy content only from a specific path (for example SentinelContent):
#   1. Add the target path to the "paths" property like such
#    paths:
#    - 'SentinelContent/**'
#    - '!.github/workflows/**'
#    - '.github/workflows/sentinel-deploy-2381b8eb-8eb0-4d08-9c71-1617aced22c6.yml'
#   2. Append the path to the directory environment variable below
#       directory: '${{ github.workspace }}/SentinelContent'

on:
  push:
    branches: [ main-sentinel-deployment ]
    paths:
    - '**'
    - '!.github/workflows/**'  # this filter prevents other workflow changes from triggering this workflow
    - '.github/workflows/sentinel-deploy-2381b8eb-8eb0-4d08-9c71-1617aced22c6.yml'

jobs:
  deploy-content:
    runs-on: windows-latest
    env:
      resourceGroupName: 'sentinel-rg-jamescoliz-DSPM-04'
      workspaceName: 'sentinel-jamescoliz-DSPM-04'
      workspaceId: 'f27bee96-0c3f-48a4-b63e-b6c95328d6bf'
      directory: '${{ github.workspace }}'
      cloudEnv: 'AzureCloud'
      contentTypes: 'CustomDetection'
      branch: 'main-sentinel-deployment'
      sourceControlId: '2381b8eb-8eb0-4d08-9c71-1617aced22c6'
      rootDirectory: '${{ github.workspace }}'
      githubAuthToken: ${{ secrets.GITHUB_TOKEN }}
      smartDeployment: 'true'
    permissions:
      contents: write
      id-token: write # Require write permission to Fetch an OIDC token.

    steps:
    - name: Login to Azure (Attempt 1)
      continue-on-error: true
      id: login1
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_2381b8eb8eb04d089c711617aced22c6 }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_2381b8eb8eb04d089c711617aced22c6 }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_2381b8eb8eb04d089c711617aced22c6 }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 1 failed
      if: ${{ steps.login1.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 2)
      continue-on-error: true
      id: login2
      uses: azure/login@v2
      if: ${{ steps.login1.outcome=='failure' }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_2381b8eb8eb04d089c711617aced22c6 }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_2381b8eb8eb04d089c711617aced22c6 }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_2381b8eb8eb04d089c711617aced22c6 }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 2 failed
      if: ${{ steps.login2.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 3)
      continue-on-error: false
      id: login3
      uses: azure/login@v2
      if: ${{ steps.login2.outcome=='failure'  }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_2381b8eb8eb04d089c711617aced22c6 }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_2381b8eb8eb04d089c711617aced22c6 }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_2381b8eb8eb04d089c711617aced22c6 }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Checkout
      uses: actions/checkout@v3

    - name: Deploy Content to Microsoft Sentinel
      uses: azure/powershell@v2
      with:
        azPSVersion: 'latest'
        inlineScript: |
          ${{ github.workspace }}//.github/workflows/azure-sentinel-deploy-2381b8eb-8eb0-4d08-9c71-1617aced22c6.ps1