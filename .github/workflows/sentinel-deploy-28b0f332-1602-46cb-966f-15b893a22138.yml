name: Deploy Content to Microsoft-Sentinel-Workspace [28b0f332-1602-46cb-966f-15b893a22138]
# Note: This workflow will deploy everything in the root directory.
# To deploy content only from a specific path (for example SentinelContent):
#   1. Add the target path to the "paths" property like such
#    paths:
#    - 'SentinelContent/**'
#    - '!.github/workflows/**'
#    - '.github/workflows/sentinel-deploy-28b0f332-1602-46cb-966f-15b893a22138.yml'
#   2. Append the path to the directory environment variable below
#       directory: '${{ github.workspace }}/SentinelContent'

on:
  push:
    branches: [ main-sentinel-deployment ]
    paths:
    - '**'
    - '!.github/workflows/**'  # this filter prevents other workflow changes from triggering this workflow
    - '.github/workflows/sentinel-deploy-28b0f332-1602-46cb-966f-15b893a22138.yml'

jobs:
  deploy-content:
    runs-on: windows-latest
    env:
      resourceGroupName: 'upsell-sync-example'
      workspaceName: 'Microsoft-Sentinel-Workspace'
      workspaceId: '73cac323-da94-49a1-96f3-4b543cd13472'
      directory: '${{ github.workspace }}'
      cloudEnv: 'AzureCloud'
      contentTypes: 'CustomDetection'
      branch: 'main-sentinel-deployment'
      sourceControlId: '28b0f332-1602-46cb-966f-15b893a22138'
      rootDirectory: '${{ github.workspace }}'
      githubAuthToken: ${{ secrets.GITHUB_TOKEN }}
      smartDeployment: 'true'
    permissions:
      contents: write
      id-token: write # Require write permission to Fetch an OIDC token.

    steps:
    - name: Login to Azure (Attempt 1)
      continue-on-error: true
      id: login1
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_28b0f332160246cb966f15b893a22138 }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_28b0f332160246cb966f15b893a22138 }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_28b0f332160246cb966f15b893a22138 }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 1 failed
      if: ${{ steps.login1.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 2)
      continue-on-error: true
      id: login2
      uses: azure/login@v2
      if: ${{ steps.login1.outcome=='failure' }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_28b0f332160246cb966f15b893a22138 }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_28b0f332160246cb966f15b893a22138 }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_28b0f332160246cb966f15b893a22138 }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 2 failed
      if: ${{ steps.login2.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 3)
      continue-on-error: false
      id: login3
      uses: azure/login@v2
      if: ${{ steps.login2.outcome=='failure'  }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_28b0f332160246cb966f15b893a22138 }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_28b0f332160246cb966f15b893a22138 }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_28b0f332160246cb966f15b893a22138 }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Checkout
      uses: actions/checkout@v3

    - name: Deploy Content to Microsoft Sentinel
      uses: azure/powershell@v2
      with:
        azPSVersion: 'latest'
        inlineScript: |
          ${{ github.workspace }}//.github/workflows/azure-sentinel-deploy-28b0f332-1602-46cb-966f-15b893a22138.ps1