name: Deploy Content to rsa-demows1 [a13051ca-4fbe-49a7-be9f-0c7d56be4878]
# Note: This workflow will deploy everything in the root directory.
# To deploy content only from a specific path (for example SentinelContent):
#   1. Add the target path to the "paths" property like such
#    paths:
#    - 'SentinelContent/**'
#    - '!.github/workflows/**'
#    - '.github/workflows/sentinel-deploy-a13051ca-4fbe-49a7-be9f-0c7d56be4878.yml'
#   2. Append the path to the directory environment variable below
#       directory: '${{ github.workspace }}/SentinelContent'

on:
  push:
    branches: [ main ]
    paths:
    - '**'
    - '!.github/workflows/**'  # this filter prevents other workflow changes from triggering this workflow
    - '.github/workflows/sentinel-deploy-a13051ca-4fbe-49a7-be9f-0c7d56be4878.yml'

jobs:
  deploy-content:
    runs-on: windows-latest
    env:
      resourceGroupName: 'rsa_demo'
      workspaceName: 'rsa-demows1'
      workspaceId: 'd14c31fb-6267-4e29-87d7-e78776807fd8'
      directory: '${{ github.workspace }}'
      cloudEnv: 'AzureCloud'
      contentTypes: 'CustomDetection'
      branch: 'main'
      sourceControlId: 'a13051ca-4fbe-49a7-be9f-0c7d56be4878'
      rootDirectory: '${{ github.workspace }}'
      githubAuthToken: ${{ secrets.GITHUB_TOKEN }}
      smartDeployment: 'true'
    permissions:
      contents: write
      id-token: write # Require write permission to Fetch an OIDC token.

    steps:
    - name: Login to Azure (Attempt 1)
      continue-on-error: true
      id: login1
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_a13051ca4fbe49a7be9f0c7d56be4878 }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_a13051ca4fbe49a7be9f0c7d56be4878 }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_a13051ca4fbe49a7be9f0c7d56be4878 }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 1 failed
      if: ${{ steps.login1.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 2)
      continue-on-error: true
      id: login2
      uses: azure/login@v2
      if: ${{ steps.login1.outcome=='failure' }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_a13051ca4fbe49a7be9f0c7d56be4878 }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_a13051ca4fbe49a7be9f0c7d56be4878 }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_a13051ca4fbe49a7be9f0c7d56be4878 }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 2 failed
      if: ${{ steps.login2.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 3)
      continue-on-error: false
      id: login3
      uses: azure/login@v2
      if: ${{ steps.login2.outcome=='failure'  }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_a13051ca4fbe49a7be9f0c7d56be4878 }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_a13051ca4fbe49a7be9f0c7d56be4878 }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_a13051ca4fbe49a7be9f0c7d56be4878 }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Checkout
      uses: actions/checkout@v3

    - name: Deploy Content to Microsoft Sentinel
      uses: azure/powershell@v2
      with:
        azPSVersion: 'latest'
        inlineScript: |
          ${{ github.workspace }}//.github/workflows/azure-sentinel-deploy-a13051ca-4fbe-49a7-be9f-0c7d56be4878.ps1